<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff3b46"/>
      <stop offset="0.45" stop-color="#ff1018"/>
      <stop offset="1" stop-color="#df0808"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f4f4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#d60000" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- rounded white app tile -->
  <rect x="50" y="50" width="412" height="412" rx="88" fill="url(#white)"/>

  <!-- YouTube-style red button -->
  <rect x="108" y="151" width="296" height="207" rx="42"
        fill="url(#red)" filter="url(#shadow)"/>

  <!-- subtle highlight -->
  <path d="M150 158 C190 146 320 146 362 158 C388 166 399 184 402 211
           C374 190 331 181 256 181 C181 181 138 190 110 211
           C113 184 124 166 150 158Z"
        fill="#ff6a70" opacity=".16"/>

  <!-- play triangle -->
  <path d="M226 211 L226 302 L307 256.5 Z" fill="#fff"/>
</svg>